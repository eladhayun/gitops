name: GitOps validation
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gitops-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    name: gitops-validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - run: |
          bash scripts/install-validation-tools.sh "$RUNNER_TEMP/gitops-tools"
          echo "$RUNNER_TEMP/gitops-tools" >> "$GITHUB_PATH"
      - run: python scripts/test-validate-gitops.py
      - run: python scripts/test-network-policy.py
      - run: python scripts/validate-gitops.py
  promote:
    name: Promote validated production
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Advance production to the validated commit
        env:
          VALIDATED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin main production
          # A newer intake commit will get its own run. Never promote stale work.
          if [ "$(git rev-parse origin/main)" != "$VALIDATED_SHA" ]; then
            echo 'Superseded by a newer main commit; leaving production unchanged.'
            exit 0
          fi
          git merge-base --is-ancestor origin/production "$VALIDATED_SHA"
          git push origin "$VALIDATED_SHA:refs/heads/production"
