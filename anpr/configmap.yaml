apiVersion: v1
kind: ConfigMap
metadata:
  name: anpr-cloud-config
data:
  ANPR_LISTEN: "0.0.0.0:8080"
  ANPR_OBJECT_STORE: "azure"
  ANPR_AZURE_CONTAINER: "anpr-plates"
  ANPR_MCP_ALLOWED_HOSTS: "anpr.jshipster.io"
  ANPR_MCP_ALLOWED_ORIGINS: "https://anpr.jshipster.io"
  ANPR_ENRICHMENT_INTERVAL_MS: "500"
  ANPR_PARKED_VEHICLE_GAP_SECONDS: "300"
  ANPR_OCR_URL: "http://127.0.0.1:8090/recognize"
  ANPR_REGISTRY_PROVIDER: "data-gov-il"
  ANPR_REGISTRY_INTERVAL_MS: "500"
  ANPR_REGISTRY_MIN_OCR_CONFIDENCE: "0.60"
  ANPR_REGISTRY_CACHE_TTL_SECONDS: "86400"
  ANPR_REGISTRY_NOT_FOUND_TTL_SECONDS: "21600"
  ANPR_SLACK_NOTIFICATIONS_URL: "http://slack-notifications.jshipster.svc.cluster.local:8080/anpr/events"
  RUST_LOG: "anpr_cloud=info,tower_http=info"
