apiVersion: apps/v1
kind: Deployment
metadata:
  name: anpr-cloud
  labels:
    app: anpr-cloud
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: anpr-cloud
  template:
    metadata:
      labels:
        app: anpr-cloud
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: anpr-cloud
          image: prodacr1234.azurecr.io/anpr-cloud:main-2680649
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: anpr-cloud-config
            - secretRef:
                name: anpr-cloud-secrets
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
