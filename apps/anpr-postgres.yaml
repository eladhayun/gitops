apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: anpr-postgres
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/jshipster-io/gitops.git
    targetRevision: production
    path: anpr-postgres
  destination:
    server: https://kubernetes.default.svc
    namespace: anpr
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
