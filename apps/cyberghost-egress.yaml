apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cyberghost-egress
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/jshipster-io/gitops.git
    targetRevision: HEAD
    path: cyberghost-egress
  destination:
    server: https://kubernetes.default.svc
    namespace: cyberghost-egress
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
