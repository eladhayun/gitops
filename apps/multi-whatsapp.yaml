apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: multi-whatsapp
  namespace: argocd
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
spec:
  project: default
  source:
    repoURL: https://github.com/eladhayun/gitops.git
    targetRevision: main
    path: multi-whatsapp/manager
  destination:
    server: https://kubernetes.default.svc
    namespace: multi-whatsapp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff: {duration: 5s, factor: 2, maxDuration: 3m}
