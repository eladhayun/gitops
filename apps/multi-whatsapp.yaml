apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: multi-whatsapp
  namespace: argocd
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
spec:
  project: default
  source:
    repoURL: https://github.com/jshipster-io/gitops.git
    targetRevision: production
    path: multi-whatsapp/manager
  destination:
    server: https://kubernetes.default.svc
    namespace: multi-whatsapp
  ignoreDifferences:
    - group: ""
      kind: ConfigMap
      name: multi-whatsapp-monitor-state
      namespace: multi-whatsapp
      jsonPointers: [/data/state.json]
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff: {duration: 5s, factor: 2, maxDuration: 3m}
