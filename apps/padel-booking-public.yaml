apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: padel-booking-public
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/eladhayun/gitops
    targetRevision: main
    path: padel-booking-public
  destination:
    server: https://kubernetes.default.svc
    namespace: padel-booking
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
