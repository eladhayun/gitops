apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: slack-notifications
  namespace: argocd
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/eladhayun/gitops.git
    targetRevision: HEAD
    path: slack-notifications

  destination:
    server: https://kubernetes.default.svc
    namespace: jshipster

  ignoreDifferences:
    - group: ''
      kind: ConfigMap
      name: padel-health-state
      namespace: jshipster
      jsonPointers:
        - /data/state.json

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true

    automated:
      selfHeal: true
      prune: true

