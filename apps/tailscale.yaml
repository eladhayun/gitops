apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://pkgs.tailscale.com/helmcharts
      chart: tailscale-operator
      targetRevision: 1.104.2
      helm:
        releaseName: tailscale-operator
        valuesObject:
          installCRDs: true
          operatorConfig:
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            hostname: jshipster-aks-operator
            defaultTags:
              - tag:k8s-operator
          proxyConfig:
            # Security patch is published for proxies; operator/chart remain 1.104.2.
            image:
              tag: v1.104.4
            defaultTags: tag:k8s
          ingressClass:
            enabled: false
          apiServerProxyConfig:
            mode: "false"
    - repoURL: https://github.com/jshipster-io/gitops.git
      targetRevision: production
      path: tailscale
  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
