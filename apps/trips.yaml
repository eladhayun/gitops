apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trips
  namespace: argocd
  annotations:
    notifications.argoproj.io/subscribe.on-created.slack: C0BV8LGEWDU
    notifications.argoproj.io/subscribe.on-deleted.slack: C0BV8LGEWDU
    notifications.argoproj.io/subscribe.on-sync-failed.slack: C0BV8LGEWDU
    notifications.argoproj.io/subscribe.on-sync-status-unknown.slack: C0BV8LGEWDU
    notifications.argoproj.io/subscribe.on-sync-succeeded.slack: C0BV8LGEWDU
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/jshipster-io/gitops.git
    targetRevision: production
    path: trips

  destination:
    server: https://kubernetes.default.svc
    namespace: trips

  syncPolicy:
    syncOptions:
      - CreateNamespace=true

    automated:
      selfHeal: true
      prune: true
