apiVersion: v1
kind: ConfigMap
metadata:
  name: cyberghost-egress-config
data:
  VPN_SERVICE_PROVIDER: cyberghost
  VPN_TYPE: openvpn
  SERVER_COUNTRIES: Israel
  OPENVPN_PROTOCOL: udp
  OPENVPN_VERBOSITY: '1'
  # Root stays confined to this pod's network namespace; no host networking.
  PUID: '0'
  PGID: '0'
  HTTPPROXY: 'on'
  HTTPPROXY_LOG: 'off'
  HTTPPROXY_LISTENING_ADDRESS: ':8888'
  HTTP_CONTROL_SERVER_ADDRESS: '127.0.0.1:8000'
  HTTP_CONTROL_SERVER_LOG: 'off'
  HEALTH_SERVER_ADDRESS: '127.0.0.1:9999'
  HEALTH_SMALL_CHECK_TYPE: dns
  HEALTH_RESTART_VPN: 'on'
  FIREWALL_ENABLED_DISABLING_IT_SHOOTS_YOU_IN_YOUR_FOOT: 'on'
  FIREWALL_INPUT_PORTS: '8888'
  # Only the current AKS subnet is exempted, for replies to proxy clients.
  # Public destinations remain subject to the VPN firewall.
  FIREWALL_OUTBOUND_SUBNETS: '10.1.1.0/24'
  LOG_LEVEL: warn
  VERSION_INFORMATION: 'off'
  TZ: UTC
