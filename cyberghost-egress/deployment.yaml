apiVersion: apps/v1
kind: Deployment
metadata:
  name: cyberghost-egress
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # One CyberGhost connection; avoid overlapping sessions during updates.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cyberghost-egress
  template:
    metadata:
      labels:
        app: cyberghost-egress
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gluetun
          # Upstream Gluetun v3.41.3, verified OCI index with linux/amd64.
          image: ghcr.io/qdm12/gluetun@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: cyberghost-egress-config
          ports:
            - name: proxy
              containerPort: 8888
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [NET_ADMIN, MKNOD]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 256Mi
          startupProbe:
            exec:
              command: [/gluetun-entrypoint, healthcheck]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: [/gluetun-entrypoint, healthcheck]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 1
          livenessProbe:
            exec:
              command: [/gluetun-entrypoint, healthcheck]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 10
          volumeMounts:
            - name: credentials
              mountPath: /run/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: state
              mountPath: /gluetun
            - name: openvpn
              mountPath: /etc/openvpn
      volumes:
        - name: credentials
          secret:
            secretName: cyberghost-egress-secrets
            defaultMode: 0400
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
        - name: state
          emptyDir:
            sizeLimit: 32Mi
        - name: openvpn
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
