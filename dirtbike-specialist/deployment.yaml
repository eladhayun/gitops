apiVersion: apps/v1
kind: Deployment
metadata:
  name: dirtbike-specialist
  labels:
    app: dirtbike-specialist
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: dirtbike-specialist
  template:
    metadata:
      annotations:
        config-revision: "2026-08-23-real-client-ip"
      labels:
        app: dirtbike-specialist
    spec:
      containers:
        - name: dirtbike-specialist
          image: prodacr1234.azurecr.io/dirtbike-specialist:main-cfbe822
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: APP_ENV
              value: "production"
            - name: ENABLE_RAG_DIAGNOSTICS
              value: "true"
            - name: ENABLE_RAG_BIKE_ROUTING
              value: "true"
            - name: ENABLE_RAG_SEMANTIC_V2_SHADOW
              value: "true"
            - name: ENABLE_RAG_HYBRID_RETRIEVAL
              value: "true"
            - name: ENABLE_RAG_RERANKING
              value: "true"
            - name: ENABLE_RAG_CONTEXTUAL_REWRITE
              value: "true"
            - name: ENABLE_RAG_MULTI_QUERY
              value: "true"
            - name: AZURE_DOCUMENT_INTELLIGENCE_MODEL
              value: "prebuilt-layout"
            - name: APP_BASE_URL
              value: "https://dirtbike.jshipster.io"
            # Trust X-Forwarded-For only when the peer chain is inside the
            # cluster VNet; ingress-nginx appends the Cloudflare-verified
            # client IP as the last hop (see nginx-ingress-controller
            # configmap-patch.yaml). Required for per-client guest quotas.
            - name: TRUSTED_PROXY_CIDRS
              value: "10.1.0.0/16"
            - name: AZURE_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: azure-openai-secrets
                  key: AZURE_OPENAI_API_KEY
            - name: AZURE_OPENAI_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: azure-openai-secrets
                  key: AZURE_OPENAI_ENDPOINT
            - name: AZURE_OPENAI_DEPLOYMENT_NAME
              value: "gpt-4.1"
            # Control target is digest-pinned to (model, deployment, prompt);
            # bump the ID whenever the deployment or prompt changes.
            - name: RAG_GENERATION_CONTROL_TARGET_ID
              value: "azure-generation-control-v6"
            - name: AZURE_OPENAI_EMBEDDING_DEPLOYMENT_NAME
              value: "text-embedding-3-large"
            - name: POSTGRES_HOST
              value: dirtbike-postgres
            - name: POSTGRES_DB
              value: dirtbike
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: dirtbike-postgres-secret
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dirtbike-postgres-secret
                  key: postgres-password
            - name: BASIC_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: azure-openai-secrets
                  key: BASIC_AUTH_USERNAME
            - name: BASIC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: azure-openai-secrets
                  key: BASIC_AUTH_PASSWORD
            # Azure AI Document Intelligence (OCR replacement for GCP Document AI)
            - name: AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: azure-document-intelligence-secret
                  key: AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT
            - name: AZURE_DOCUMENT_INTELLIGENCE_KEY
              valueFrom:
                secretKeyRef:
                  name: azure-document-intelligence-secret
                  key: AZURE_DOCUMENT_INTELLIGENCE_KEY
            # Azure AI Speech (server-side STT for chat-composer mic).
            - name: AZURE_SPEECH_KEY
              valueFrom:
                secretKeyRef:
                  name: azure-speech-secret
                  key: AZURE_SPEECH_KEY
            - name: AZURE_SPEECH_REGION
              valueFrom:
                secretKeyRef:
                  name: azure-speech-secret
                  key: AZURE_SPEECH_REGION
            # Session authentication secret
            - name: AUTH_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: azure-openai-secrets
                  key: AUTH_SESSION_SECRET
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: azure-openai-secrets
                  key: GOOGLE_CLIENT_ID
            - name: ENABLE_PHONE_AUTH
              value: "false"
            # Owner authorization
            - name: OWNER_EMAILS
              valueFrom:
                secretKeyRef:
                  name: azure-openai-secrets
                  key: OWNER_EMAILS
            - name: OWNER_PHONES
              valueFrom:
                secretKeyRef:
                  name: azure-openai-secrets
                  key: OWNER_PHONES
            - name: TWILIO_ACCOUNT_SID
              valueFrom:
                secretKeyRef:
                  name: azure-openai-secrets
                  key: TWILIO_ACCOUNT_SID
            - name: TWILIO_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: azure-openai-secrets
                  key: TWILIO_AUTH_TOKEN
            - name: TWILIO_SMS_FROM
              valueFrom:
                secretKeyRef:
                  name: azure-openai-secrets
                  key: TWILIO_SMS_FROM
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
