apiVersion: batch/v1
kind: Job
metadata:
  name: rag-shadow-xplor-benchmark-20260818
  labels:
    app: dirtbike-specialist
    purpose: rag-shadow-canary-benchmark
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: dirtbike-specialist-shadow-canary
        purpose: rag-shadow-canary-benchmark
    spec:
      restartPolicy: Never
      containers:
        - name: benchmark-shadow
          image: prodacr1234.azurecr.io/dirtbike-specialist:main-8e74c64
          imagePullPolicy: Always
          command:
            - ./server
            - benchmark-shadow
            - f6c6ef1e9ff65b1f00637bd3abc7f2e2e7987517a13b986445f43f156d7bc3c7
            - 73b4b5d7a4b58232689f9e6190ce056c9dcccbc787e4a42706576e75340ce902
            - According to the XPLOR PRO 6500 manual, what is the standard compression damping setting for a 250 EXC TPI?
          env:
            - name: APP_ENV
              value: "production"
            - name: ENABLE_RAG_SEMANTIC_V2_SHADOW
              value: "true"
            - name: AZURE_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: azure-openai-secrets
                  key: AZURE_OPENAI_API_KEY
            - name: AZURE_OPENAI_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: azure-openai-secrets
                  key: AZURE_OPENAI_ENDPOINT
            - name: AZURE_OPENAI_DEPLOYMENT_NAME
              value: "gpt-4o-mini"
            - name: AZURE_OPENAI_EMBEDDING_DEPLOYMENT_NAME
              value: "text-embedding-3-large"
            - name: POSTGRES_HOST
              value: dirtbike-postgres
            - name: POSTGRES_DB
              value: dirtbike
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: dirtbike-postgres-secret
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dirtbike-postgres-secret
                  key: postgres-password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
