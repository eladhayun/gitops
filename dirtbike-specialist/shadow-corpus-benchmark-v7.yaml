apiVersion: batch/v1
kind: Job
metadata:
  name: rag-shadow-corpus-benchmark-20260818-v7
  labels:
    app: dirtbike-specialist
    purpose: rag-shadow-corpus-benchmark
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        app: dirtbike-specialist-shadow
        purpose: rag-shadow-corpus-benchmark
    spec:
      restartPolicy: Never
      containers:
        - name: benchmark
          image: prodacr1234.azurecr.io/dirtbike-specialist:main-aaa33b9
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -c
          args:
            - |
              until [ -s /work/dataset.json ]; do sleep 2; done
              mkdir -p /work/output
              ./rageval \
                -dataset /work/dataset.json \
                -benchmark \
                -record-benchmark \
                -benchmark-reference production-shadow-20260818-aaa33b9 \
                -timeout 45s \
                -output-dir /work/output \
                > /work/report.json 2> /work/benchmark.log
              status=$?
              echo "$status" > /work/status
              touch /work/finished
              until [ -f /work/release ]; do sleep 2; done
              exit "$status"
          env:
            - name: APP_ENV
              value: "production"
            - name: ENABLE_RAG_SEMANTIC_V2_SHADOW
              value: "true"
            - name: AZURE_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: azure-openai-secrets
                  key: AZURE_OPENAI_API_KEY
            - name: AZURE_OPENAI_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: azure-openai-secrets
                  key: AZURE_OPENAI_ENDPOINT
            - name: AZURE_OPENAI_DEPLOYMENT_NAME
              value: "gpt-4o-mini"
            - name: AZURE_OPENAI_EMBEDDING_DEPLOYMENT_NAME
              value: "text-embedding-3-large"
            - name: AZURE_OPENAI_EMBEDDING_DIMENSIONS
              value: "3072"
            - name: AZURE_EMBEDDING_PROFILE_ID
              value: azure-text-embedding-3-large-d3072
            - name: POSTGRES_HOST
              value: dirtbike-postgres
            - name: POSTGRES_DB
              value: dirtbike
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: dirtbike-postgres-secret
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dirtbike-postgres-secret
                  key: postgres-password
          volumeMounts:
            - name: work
              mountPath: /work
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1500m
              memory: 2Gi
      volumes:
        - name: work
          emptyDir: {}
