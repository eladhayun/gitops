apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ingress-nginx
resources:
- namespace.yaml
- ingressclass.yaml
- service.yaml
- serviceaccount.yaml
- rbac.yaml
- deployment.yaml
- pdb.yaml
configMapGenerator:
- name: traefik-static
