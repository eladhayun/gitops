tcp:
  routers:
    bastion:
      entryPoints:
      - ssh
      rule: HostSNI(`*`)
      service: bastion
  services:
    bastion:
      loadBalancer:
        servers:
        - address: jshipster-bastion.default.svc.cluster.local:22
http:
  middlewares:
    security-headers:
      headers:
        stsSeconds: 15724800
        stsIncludeSubdomains: true
tls:
  options:
    default:
      minVersion: VersionTLS12
