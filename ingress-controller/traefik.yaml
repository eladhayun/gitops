global:
  checkNewVersion: false
  sendAnonymousUsage: false
log:
  level: INFO
  format: json
entryPoints:
  web:
    address: :8080
    forwardedHeaders:
      trustedIPs: &id001
      - 173.245.48.0/20
      - 103.21.244.0/22
      - 103.22.200.0/22
      - 103.31.4.0/22
      - 141.101.64.0/18
      - 108.162.192.0/18
      - 190.93.240.0/20
      - 188.114.96.0/20
      - 197.234.240.0/22
      - 198.41.128.0/17
      - 162.158.0.0/15
      - 104.16.0.0/13
      - 104.24.0.0/14
      - 172.64.0.0/13
      - 131.0.72.0/22
      - 2400:cb00::/32
      - 2606:4700::/32
      - 2803:f800::/32
      - 2405:b500::/32
      - 2405:8100::/32
      - 2a06:98c0::/29
      - 2c0f:f248::/32
    transport:
      respondingTimeouts:
        readTimeout: 60s
        writeTimeout: 0s
        idleTimeout: 75s
      lifeCycle:
        requestAcceptGraceTimeout: 5s
        graceTimeOut: 60s
    http:
      aliasHeadersStrategy: delete
  websecure:
    address: :8443
    forwardedHeaders:
      trustedIPs: *id001
    transport:
      respondingTimeouts:
        readTimeout: 60s
        writeTimeout: 0s
        idleTimeout: 75s
      lifeCycle:
        requestAcceptGraceTimeout: 5s
        graceTimeOut: 60s
    http:
      middlewares:
      - security-headers@file
      aliasHeadersStrategy: delete
  ssh:
    address: :2222
    transport:
      lifeCycle:
        requestAcceptGraceTimeout: 5s
        graceTimeOut: 60s
    http:
      aliasHeadersStrategy: delete
  health:
    address: :8082
    http:
      aliasHeadersStrategy: delete
ping:
  entryPoint: health
providers:
  kubernetesIngressNGINX:
    ingressClass: nginx
    controllerClass: k8s.io/ingress-nginx
    watchIngressWithoutClass: false
    allowSnippetAnnotations: false
    allowCrossNamespaceResources: false
    disableSvcExternalName: true
    httpEntryPoint: web
    httpsEntryPoint: websecure
    proxyRequestBuffering: true
    proxyBodySize: '1048576'
    proxyConnectTimeout: 5
    proxyReadTimeout: 60
    proxySendTimeout: 60
  file:
    filename: /etc/traefik/dynamic/routes.yaml
    watch: false
