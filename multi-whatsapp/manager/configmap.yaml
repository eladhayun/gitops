apiVersion: v1
kind: ConfigMap
metadata:
  name: multi-whatsapp-config
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
data:
  MW_GITHUB_REPOSITORY: eladhayun/gitops
  MW_GITHUB_BRANCH: main
  MW_INVENTORY_PATH: multi-whatsapp/accounts
  MW_SOCKET_PATH: /run/multi-whatsapp/manager.sock
  MW_LISTEN_ADDRESS: :8080
  MW_WORKER_LISTEN_ADDRESS: :8081
  MW_WORKER_DNS_SUFFIX: multi-whatsapp.svc.cluster.local
  MW_APPLICATIONSET_NAME: multi-whatsapp-accounts
  MW_APPLICATIONSET_NAMESPACE: argocd
  MW_DATABASE_DSN_FILE: /private/runtime/database-dsn
  MW_WORKER_SECRET_FILE: /private/runtime/worker-secret
  MW_GITHUB_TOKEN_FILE: /private/manager/github-token
  MW_AZURE_STORAGE_ACCOUNT: jshipsterprod410479
  MW_AZURE_STORAGE_CONTAINER: multi-whatsapp-media
  MW_AZURE_STORAGE_KEY_FILE: /private/runtime/azure-storage-key
  PGSSLROOTCERT: /private/runtime/postgres-ca.crt
  TZ: Asia/Jerusalem
