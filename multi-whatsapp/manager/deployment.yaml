apiVersion: apps/v1
kind: Deployment
metadata:
  name: multi-whatsapp-manager
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: multi-whatsapp-manager
  template:
    metadata:
      annotations:
        multi-whatsapp/config-generation: slack-monitoring-v1
      labels:
        app.kubernetes.io/name: multi-whatsapp-manager
        app.kubernetes.io/part-of: multi-whatsapp
    spec:
      serviceAccountName: multi-whatsapp-manager
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: manager
          image: multi-whatsapp
          args: [manager]
          envFrom:
            - configMapRef: {name: multi-whatsapp-config}
          ports:
            - {name: http, containerPort: 8080}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '1', memory: 512Mi}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - {name: runtime, mountPath: /private/runtime, readOnly: true}
            - {name: manager, mountPath: /private/manager, readOnly: true}
            - {name: socket, mountPath: /run/multi-whatsapp}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: runtime
          secret: {secretName: multi-whatsapp-runtime, defaultMode: 0440}
        - name: manager
          secret: {secretName: multi-whatsapp-manager, defaultMode: 0440}
        - name: socket
          emptyDir: {medium: Memory, sizeLimit: 8Mi}
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
