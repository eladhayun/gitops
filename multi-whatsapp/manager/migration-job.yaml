apiVersion: batch/v1
kind: Job
metadata:
  name: multi-whatsapp-migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: '-1'
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: multi-whatsapp-migrate
        app.kubernetes.io/part-of: multi-whatsapp
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrate
          image: multi-whatsapp
          args: [migrate]
          env:
            - {name: MW_DATABASE_DSN_FILE, value: /private/migration/migration-dsn}
            - {name: MW_MIGRATION_DSN_FILE, value: /private/migration/migration-dsn}
            - {name: PGSSLROOTCERT, value: /private/migration/postgres-ca.crt}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: '1', memory: 512Mi}
          volumeMounts:
            - {name: migration, mountPath: /private/migration, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: migration
          secret: {secretName: multi-whatsapp-migration, defaultMode: 0440}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
