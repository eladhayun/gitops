apiVersion: v1
kind: ServiceAccount
metadata:
  name: multi-whatsapp-monitor
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: multi-whatsapp-monitor-state
  annotations:
    argocd.argoproj.io/sync-options: RespectIgnoreDifferences=true
data:
  state.json: '{}'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: multi-whatsapp-monitor
rules:
  - apiGroups: ['']
    resources: [configmaps]
    resourceNames: [multi-whatsapp-monitor-state]
    verbs: [get, update]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [multi-whatsapp-manager]
    verbs: [get]
  - apiGroups: ['']
    resources: [pods]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: multi-whatsapp-monitor
subjects:
  - kind: ServiceAccount
    name: multi-whatsapp-monitor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: multi-whatsapp-monitor
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: multi-whatsapp-monitor
spec:
  schedule: '* * * * *'
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 30
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 55
      template:
        metadata:
          labels:
            app.kubernetes.io/name: multi-whatsapp-monitor
        spec:
          serviceAccountName: multi-whatsapp-monitor
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: monitor
              image: multi-whatsapp
              args: [monitor]
              envFrom:
                - configMapRef: {name: multi-whatsapp-config}
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {cpu: 200m, memory: 128Mi}
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: database, mountPath: /private/runtime, readOnly: true}
          volumes:
            - name: database
              secret:
                secretName: multi-whatsapp-runtime
                defaultMode: 0440
                items:
                  - {key: database-dsn, path: database-dsn}
                  - {key: postgres-ca.crt, path: postgres-ca.crt}
