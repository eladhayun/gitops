apiVersion: apps/v1
kind: Deployment
metadata:
  name: mw-account-{{ .Values.accountID }}
  labels:
    app.kubernetes.io/part-of: multi-whatsapp
    multi-whatsapp/account-id: {{ .Values.accountID | quote }}
spec:
  replicas: {{ ternary 1 0 .Values.enabled }}
  revisionHistoryLimit: 2
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: multi-whatsapp-worker
      multi-whatsapp/account-id: {{ .Values.accountID | quote }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: multi-whatsapp-worker
        app.kubernetes.io/part-of: multi-whatsapp
        multi-whatsapp/account-id: {{ .Values.accountID | quote }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          {{- if .Values.image.digest }}
          image: {{ printf "%s@%s" .Values.image.repository .Values.image.digest | quote }}
          {{- else }}
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          {{- end }}
          args: [worker, --account-id, {{ .Values.accountID | quote }}]
          envFrom:
            - configMapRef: {name: multi-whatsapp-config}
          env:
            - name: MW_ACCOUNT_GENERATION
              value: {{ .Values.generation | quote }}
          ports:
            - {name: private, containerPort: 8081}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /healthz, port: private}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /readyz, port: private}
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - {name: runtime, mountPath: /private/runtime, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: runtime
          secret: {secretName: multi-whatsapp-runtime, defaultMode: 0440}
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
