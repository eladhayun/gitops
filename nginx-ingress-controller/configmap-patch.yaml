apiVersion: v1
kind: ConfigMap
metadata:
  name: ingress-nginx-controller
  namespace: ingress-nginx
data:
  # Pass real client IPs through to backends. All public hosts are
  # Cloudflare-proxied, so forwarded headers are trusted ONLY when the
  # direct peer is a Cloudflare edge (proxy-real-ip-cidr below); a client
  # hitting the LoadBalancer IP directly cannot spoof X-Forwarded-For
  # because its own peer address is appended as the last untrusted hop.
  # The service uses externalTrafficPolicy: Local, so peer IPs are real.
  use-forwarded-headers: "true"
  # Cloudflare published ranges: https://www.cloudflare.com/ips/
  proxy-real-ip-cidr: "173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32"
