apiVersion: v1
kind: Service
metadata:
  name: ingress-nginx-controller
  namespace: ingress-nginx
  annotations:
    external-dns.alpha.kubernetes.io/hostname: debug.jshipster.io
spec:
  ports:
  - name: ssh
    port: 22
    protocol: TCP
    targetPort: ssh
  selector:
    $patch: replace
    app.kubernetes.io/name: traefik
