apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: padel-booking
resources:
  - resources.yaml
configMapGenerator:
  - name: padel-booking-public-pages
    files:
      - site/index.html
      - site/privacy.html
      - site/terms.html
      - site/site.css
  - name: padel-booking-public-nginx
    files:
      - nginx.conf
