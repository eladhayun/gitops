apiVersion: v1
kind: ConfigMap
metadata:
  name: shared-postgres-migration
  namespace: postgres
data:
  dump.sh: |
    #!/bin/sh
    set -eu

    export PGPASSWORD="${SOURCE_PASSWORD}"
    archive="/migration/${DATABASE}.dump"
    archive_list="/migration/${DATABASE}.list"
    restore_list="/migration/${DATABASE}.restore.list"

    echo "Creating a consistent, portable dump of ${DATABASE} from ${SOURCE_HOST}"
    pg_dump \
      --host="${SOURCE_HOST}" \
      --port=5432 \
      --username="${SOURCE_USER}" \
      --dbname="${DATABASE}" \
      --format=custom \
      --compress=gzip:6 \
      --no-owner \
      --no-acl \
      --serializable-deferrable \
      --file="${archive}"

    test -s "${archive}"
    pg_restore --list "${archive}" > "${archive_list}"
    test -s "${archive_list}"

    # pgvector is installed by the target administrator. Exclude its extension
    # declarations so the non-superuser database owner can restore everything
    # else without trying to own or recreate the extension itself.
    grep -vE ' EXTENSION - vector($| )| COMMENT - EXTENSION vector($| )' \
      "${archive_list}" > "${restore_list}"
    test -s "${restore_list}"

    cd /migration
    sha256sum "${DATABASE}.dump" > "${DATABASE}.dump.sha256"
    echo "Portable dump validated: $(du -h "${archive}" | cut -f1)"

  upload.sh: |
    #!/bin/sh
    set -eu

    archive="/migration/${DATABASE}.dump"
    checksum="${archive}.sha256"
    digest="$(cut -d ' ' -f 1 "${checksum}")"
    blob="${MIGRATION_PREFIX}/${DATABASE}-${digest}.dump"

    exists="$(az storage blob exists \
      --account-name "${AZURE_STORAGE_ACCOUNT}" \
      --account-key "${AZURE_STORAGE_KEY}" \
      --container-name pg-backups \
      --name "${blob}" \
      --query exists \
      --output tsv)"

    if [ "${exists}" != "true" ]; then
      az storage blob upload \
        --account-name "${AZURE_STORAGE_ACCOUNT}" \
        --account-key "${AZURE_STORAGE_KEY}" \
        --container-name pg-backups \
        --name "${blob}" \
        --file "${archive}" \
        --overwrite false \
        --validate-content true \
        --only-show-errors
      az storage blob upload \
        --account-name "${AZURE_STORAGE_ACCOUNT}" \
        --account-key "${AZURE_STORAGE_KEY}" \
        --container-name pg-backups \
        --name "${blob}.sha256" \
        --file "${checksum}" \
        --overwrite false \
        --validate-content true \
        --only-show-errors
    fi

    local_size="$(wc -c < "${archive}" | tr -d ' ')"
    remote_size="$(az storage blob show \
      --account-name "${AZURE_STORAGE_ACCOUNT}" \
      --account-key "${AZURE_STORAGE_KEY}" \
      --container-name pg-backups \
      --name "${blob}" \
      --query properties.contentLength \
      --output tsv)"
    test "${local_size}" = "${remote_size}"
    echo "Stored ${DATABASE} preload recovery point at pg-backups/${blob}"

  restore.sh: |
    #!/bin/sh
    set -eu

    export PGPASSWORD="${TARGET_PASSWORD}"
    target_host="shared-postgres.postgres.svc.cluster.local"
    archive="/migration/${DATABASE}.dump"
    restore_list="/migration/${DATABASE}.restore.list"

    existing_relations="$(psql -X -A -t \
      --host="${target_host}" \
      --port=5432 \
      --username="${TARGET_USER}" \
      --dbname="${DATABASE}" \
      --set=ON_ERROR_STOP=1 \
      --command="SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname NOT IN ('pg_catalog','information_schema') AND n.nspname !~ '^pg_toast' AND c.relkind IN ('r','p','S','v','m','f');")"
    if [ "${existing_relations}" != "0" ]; then
      echo "Refusing to restore ${DATABASE}: target already has ${existing_relations} user relations" >&2
      exit 1
    fi

    echo "Restoring ${DATABASE} as non-superuser owner ${TARGET_USER}"
    pg_restore \
      --host="${target_host}" \
      --port=5432 \
      --username="${TARGET_USER}" \
      --dbname="${DATABASE}" \
      --no-owner \
      --no-acl \
      --exit-on-error \
      --single-transaction \
      --use-list="${restore_list}" \
      "${archive}"

    invalid_indexes="$(psql -X -A -t \
      --host="${target_host}" \
      --port=5432 \
      --username="${TARGET_USER}" \
      --dbname="${DATABASE}" \
      --set=ON_ERROR_STOP=1 \
      --command="SELECT count(*) FROM pg_index WHERE NOT indisvalid OR NOT indisready;")"
    test "${invalid_indexes}" = "0"
    vacuumdb \
      --host="${target_host}" \
      --port=5432 \
      --username="${TARGET_USER}" \
      --dbname="${DATABASE}" \
      --analyze-in-stages
    echo "Restore and index validation completed for ${DATABASE}"
