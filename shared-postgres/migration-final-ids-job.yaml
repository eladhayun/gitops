apiVersion: batch/v1
kind: Job
metadata:
  name: shared-postgres-final-ids-20260901t071004z
  namespace: postgres
  annotations:
    argocd.argoproj.io/sync-wave: "75"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 7200
  template:
    metadata:
      labels: {app: shared-postgres-migration, database: ids_embeddings, phase: final}
    spec:
      restartPolicy: Never
      initContainers:
        - name: dump
          image: postgres:17-alpine
          command: [/scripts/dump.sh]
          env:
            - {name: DATABASE, value: ids_embeddings}
            - {name: SOURCE_HOST, value: ids-postgres.ids.svc.cluster.local}
            - name: SOURCE_USER
              valueFrom: {secretKeyRef: {name: shared-postgres-migration-secrets, key: IDS_PGUSER}}
            - name: SOURCE_PASSWORD
              valueFrom: {secretKeyRef: {name: shared-postgres-migration-secrets, key: IDS_PGPASSWORD}}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - {name: scripts, mountPath: /scripts, readOnly: true}
            - {name: migration, mountPath: /migration}
        - name: upload
          image: mcr.microsoft.com/azure-cli:latest
          command: [/scripts/upload.sh]
          env:
            - {name: DATABASE, value: ids_embeddings}
            - {name: MIGRATION_PREFIX, value: consolidation/final/20260901T071004Z}
            - name: AZURE_STORAGE_ACCOUNT
              valueFrom: {secretKeyRef: {name: shared-postgres-migration-secrets, key: AZURE_STORAGE_ACCOUNT}}
            - name: AZURE_STORAGE_KEY
              valueFrom: {secretKeyRef: {name: shared-postgres-migration-secrets, key: AZURE_STORAGE_KEY}}
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {cpu: 200m, memory: 512Mi}
          volumeMounts:
            - {name: scripts, mountPath: /scripts, readOnly: true}
            - {name: migration, mountPath: /migration}
      containers:
        - name: restore
          image: pgvector/pgvector:pg17
          command: [/scripts/final-restore.sh]
          env:
            - {name: DATABASE, value: ids_embeddings}
            - {name: TARGET_USER, value: ids_user}
            - {name: VECTOR_REQUIRED, value: "true"}
            - name: TARGET_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: shared-postgres-secrets, key: POSTGRES_ADMIN_PASSWORD}}
            - name: TARGET_PASSWORD
              valueFrom: {secretKeyRef: {name: shared-postgres-secrets, key: IDS_PASSWORD}}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: scripts, mountPath: /scripts, readOnly: true}
            - {name: migration, mountPath: /migration}
      volumes:
        - name: scripts
          configMap: {name: shared-postgres-migration, defaultMode: 0555}
        - name: migration
          emptyDir: {sizeLimit: 2Gi}
