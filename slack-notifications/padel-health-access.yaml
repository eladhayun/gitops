apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: padel-health-reader
  namespace: padel-booking
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [padel-booking]
    verbs: [get]
  - apiGroups: ['']
    resources: [pods]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: padel-health-reader
  namespace: padel-booking
subjects:
  - kind: ServiceAccount
    name: padel-health-monitor
    namespace: jshipster
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: padel-health-reader
