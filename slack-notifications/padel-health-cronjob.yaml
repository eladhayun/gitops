apiVersion: v1
kind: ServiceAccount
metadata:
  name: padel-health-monitor
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: padel-health-state
  annotations:
    # State is owned by the monitor after creation, not reset on GitOps sync.
    argocd.argoproj.io/sync-options: RespectIgnoreDifferences=true
data:
  state.json: '{}'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: padel-health-state
rules:
  - apiGroups: ['']
    resources: [configmaps]
    resourceNames: [padel-health-state]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: padel-health-state
subjects:
  - kind: ServiceAccount
    name: padel-health-monitor
    namespace: jshipster
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: padel-health-state
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: padel-health-monitor
spec:
  schedule: '*/2 * * * *'
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 60
      template:
        metadata:
          labels:
            app: padel-health-monitor
        spec:
          serviceAccountName: padel-health-monitor
          restartPolicy: Never
          containers:
            - name: monitor
              image: prodacr1234.azurecr.io/slack-notifications:main-3a8da56
              command: [/root/slack-notifications]
              args: [padel-health-check]
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              resources:
                requests: {cpu: 5m, memory: 16Mi}
                limits: {cpu: 50m, memory: 64Mi}
