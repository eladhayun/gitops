apiVersion: v1
kind: Service
metadata:
  name: tailscale-cluster-dns
  namespace: kube-system
spec:
  type: ClusterIP
  # Avoid 10.0.0.0/24, which overlaps the owner's LAN.
  clusterIP: 10.0.255.53
  selector:
    k8s-app: kube-dns
  ports:
    - name: dns
      port: 53
      protocol: UDP
      targetPort: 53
    - name: dns-tcp
      port: 53
      protocol: TCP
      targetPort: 53
