apiVersion: apps/v1
kind: Deployment
metadata:
  name: trips
  labels:
    app: trips
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: trips
  template:
    metadata:
      labels:
        app: trips
    spec:
      containers:
      - name: trips
        # Placeholder image, will be updated by CI
        image: prodacr1234.azurecr.io/trips:main-65fe189
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        # Keep Basic Auth configured until CI deploys the Google-login image.
        - name: TRIPS_USERNAME
          valueFrom:
            secretKeyRef:
              name: trips-auth
              key: username
        - name: TRIPS_PASSWORD_SHA256
          valueFrom:
            secretKeyRef:
              name: trips-auth
              key: password-sha256
        - name: TRIPS_BASE_URL
          value: "https://trips.jshipster.io"
        - name: TRIPS_ALLOWED_EMAILS
          value: "elad.hayun@gmail.com,osnat.fried@gmail.com"
        - name: TRIPS_GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: trips-auth
              key: google-client-id
        - name: TRIPS_GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: trips-auth
              key: google-client-secret
        - name: TRIPS_SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: trips-auth
              key: session-secret
        - name: TRIPS_GOOGLE_MAPS_API_KEY
          valueFrom:
            secretKeyRef:
              name: trips-auth
              key: google-maps-api-key
        - name: TRIPS_SLACK_NOTIFICATIONS_URL
          value: "http://slack-notifications.jshipster.svc.cluster.local:8080/notify"
        - name: TRIPS_SLACK_CHANNEL
          value: "C0BV8LGEWDU"
        - name: TRIPS_SIGNIN_NOTIFY_COOLDOWN
          value: "30m"
        resources:
          requests:
            memory: "12Mi"
            cpu: "5m"
          limits:
            memory: "32Mi"
            cpu: "50m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 2
