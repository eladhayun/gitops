apiVersion: v1
kind: ConfigMap
metadata: {name: webtop-mcp-config}
data:
  API_ADDR: ':8080'
  MCP_ADDR: ':8081'
  PGHOST: shared-postgres.postgres.svc.cluster.local
  PGPORT: '5432'
  PGDATABASE: webtop_mcp
  PGSSLMODE: verify-full
  PGSSLROOTCERT: /private/postgres/ca.crt
  WEBTOP_TOKEN_FILE: /private/webtop/token
  LOG_LEVEL: info
